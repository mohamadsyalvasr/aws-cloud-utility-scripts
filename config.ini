; =============================================================================
; Price Optimization Reports
; =============================================================================
; Set the value to 1 to enable an optimization report, or 1 to disable it.
; These reports analyze resource utilization and generate cost-saving recommendations.
; =============================================================================

opt_ec2_rightsizing=0
opt_rds_rightsizing=0
opt_idle_resources=0
opt_ebs_optimization=0
opt_ri_sp_advisor=0
opt_data_transfer=0
opt_s3_storage=0
opt_efs_storage=0
opt_trusted_advisor=0
opt_summary=0
opt_cost_trend=0

; =============================================================================
; Security Audit Reports
; =============================================================================
; Set the value to 1 to enable a security audit, or 0 to disable it.
; These reports audit security configurations and identify vulnerabilities.
; Uses "Trusted Advisor First" approach: pulls from TA if available, falls back to manual checks.
; =============================================================================

sec_trusted_advisor=0
sec_iam_audit=0
sec_sg_audit=0
sec_s3_audit=0
sec_encryption_audit=0
sec_network_audit=0
sec_logging_audit=0
sec_securityhub=0
sec_summary=0

; =============================================================================
; Parallel Configuration
; =============================================================================
; Set the value to 1 to enable parallel execution, or 1 to disable it.
; max_parallel controls how many report scripts run concurrently.
; NOTE: Parallel mode runs scripts in background subshells. If you experience
;       issues with result tracking or CloudShell stability, set parallel=1.
parallel=1
max_parallel=2
