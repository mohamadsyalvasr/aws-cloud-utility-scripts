# =============================================================================
# Multi-Account Configuration
# =============================================================================
# List target AWS accounts for cross-account report generation.
#
# FORMAT: Account_ID|Role_Name|Account_Alias
#
#   Account_ID    : 12-digit AWS account ID (required)
#   Role_Name     : IAM role name to assume in the target account (required)
#   Account_Alias : Friendly name for the account (optional, used in output dirs)
#
# Lines starting with # are comments and are ignored.
# Empty lines are ignored.
#
# PREREQUISITES:
#   Each target account must have the IAM role configured.
#   See docs/multi-account-setup.md for setup instructions.
#
# EXAMPLES:
# 123456789012|CrossAccountReportRole|production
# 234567890123|CrossAccountReportRole|staging
# 345678901234|CrossAccountReportRole|development
# 456789012345|CrossAccountReportRole
# =============================================================================
